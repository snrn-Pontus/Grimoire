<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f0b18"/><stop offset="1" stop-color="#15101f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-opacity=".45"/></filter>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill:#f5f1ff }
      .title { font-size:54px; font-weight:800; letter-spacing:2px }
      .sub { font-size:22px; fill:#b9adca }
      .h { font-size:30px; font-weight:800 }
      .sh { font-size:17px; fill:#c9bfd7 }
      .row { font-size:20px; font-weight:600 }
      .small { font-size:15px; fill:#d6cfdf }
      .key { font-size:17px; font-weight:800; text-anchor:middle; dominant-baseline:middle }
      .section { font-size:14px; font-weight:800; letter-spacing:1.5px; fill:#a99bb9 }
    </style>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <circle cx="800" cy="560" r="360" fill="#321252" opacity=".22"/>
  <circle cx="800" cy="560" r="260" fill="#5b1d84" opacity=".12"/>

  <text x="800" y="68" text-anchor="middle" class="title">GRIMOIRE — DEFAULT BINDINGS</text>
  <text x="800" y="104" text-anchor="middle" class="sub">Affliction Warlock • WoW: Forever • Grimoire-managed buttons only</text>

  <!-- Base -->
  <g>
    <rect x="35" y="145" width="470" height="440" rx="20" fill="#171120" stroke="#a263e9" stroke-width="3"/>
    <text x="65" y="188" class="h" fill="#c78cff">BASE</text>
    <text x="65" y="216" class="sh">No triggers held — leveling loop / core damage</text>
    <text x="65" y="254" class="section">D-PAD</text>
    <g transform="translate(65,275)">
      <rect width="42" height="34" rx="9" fill="#2b183b"/><text x="21" y="17" class="key">↑</text><text x="58" y="23" class="row">Drain Soul</text>
      <rect y="44" width="42" height="34" rx="9" fill="#2b183b"/><text x="21" y="61" class="key">→</text><text x="58" y="67" class="row">Fear</text>
      <rect y="88" width="42" height="34" rx="9" fill="#2b183b"/><text x="21" y="105" class="key">↓</text><text x="58" y="111" class="row">Shoot (wand)</text>
      <rect y="132" width="42" height="34" rx="9" fill="#2b183b"/><text x="21" y="149" class="key">←</text><text x="58" y="155" class="row">Shadow Bolt</text>
    </g>
    <text x="65" y="442" class="section">BACK PADDLES</text>
    <g transform="translate(65,460)">
      <rect width="44" height="32" rx="9" fill="#2b183b"/><text x="22" y="16" class="key">P1</text><text x="60" y="21" class="row">WL Corruption</text><text x="235" y="21" class="small">Corruption + /petattack</text>
      <rect y="38" width="44" height="32" rx="9" fill="#2b183b"/><text x="22" y="54" class="key">P2</text><text x="60" y="59" class="row">Bane of Agony</text>
      <rect y="76" width="44" height="32" rx="9" fill="#2b183b"/><text x="22" y="92" class="key">P3</text><text x="60" y="97" class="row">Drain Life</text>
      <rect y="114" width="44" height="32" rx="9" fill="#2b183b"/><text x="22" y="130" class="key">P4</text><text x="60" y="135" class="row">Life Tap</text>
    </g>
  </g>

  <!-- LT -->
  <g>
    <rect x="1095" y="145" width="470" height="440" rx="20" fill="#0f2018" stroke="#4ed889" stroke-width="3"/>
    <text x="1125" y="188" class="h" fill="#67eca0">LT</text>
    <text x="1125" y="216" class="sh">Hold left trigger — survival / sustain</text>
    <text x="1125" y="254" class="section">FACE BUTTONS</text>
    <g transform="translate(1125,275)">
      <rect width="42" height="34" rx="17" fill="#163526"/><text x="21" y="17" class="key">X</text><text x="58" y="23" class="row">Siphon Life</text><text x="220" y="23" class="small">→ Searing Pain until learned</text>
      <rect y="44" width="42" height="34" rx="17" fill="#163526"/><text x="21" y="61" class="key">Y</text><text x="58" y="67" class="row">Health Funnel</text>
      <rect y="88" width="42" height="34" rx="17" fill="#163526"/><text x="21" y="105" class="key">B</text><text x="58" y="111" class="row">Curse of Weakness</text>
      <rect y="132" width="42" height="34" rx="17" fill="#163526"/><text x="21" y="149" class="key">A</text><text x="58" y="155" class="row">Immolate</text>
    </g>
    <text x="1125" y="472" class="section">D-PAD / PADDLES</text>
    <text x="1125" y="500" class="small">↑ WL PetAttack   •   → Rain of Fire</text>
    <text x="1125" y="524" class="small">↓ WL PetFollow   •   ← SmartManaPotion</text>
    <text x="1125" y="548" class="small">P1 WL Healthstone   •   P2 SmartHealthPotion</text>
    <text x="1125" y="572" class="small">P3 WL Torment   •   P4 WL Sacrifice</text>
  </g>

  <!-- RT -->
  <g>
    <rect x="35" y="610" width="470" height="445" rx="20" fill="#211010" stroke="#e65d66" stroke-width="3"/>
    <text x="65" y="653" class="h" fill="#ff7a83">RT</text>
    <text x="65" y="681" class="sh">Hold right trigger — pet / demon control</text>
    <text x="65" y="719" class="section">FACE BUTTONS</text>
    <g transform="translate(65,730)">
      <rect width="42" height="34" rx="17" fill="#3a171a"/><text x="21" y="17" class="key">X</text><text x="58" y="23" class="row">Summon Voidwalker</text>
      <rect y="44" width="42" height="34" rx="17" fill="#3a171a"/><text x="21" y="61" class="key">Y</text><text x="58" y="67" class="row">Summon Felhunter</text><text x="247" y="67" class="small">→ Summon Imp until learned</text>
      <rect y="88" width="42" height="34" rx="17" fill="#3a171a"/><text x="21" y="105" class="key">B</text><text x="58" y="111" class="row">Summon Succubus</text>
      <rect y="132" width="42" height="34" rx="17" fill="#3a171a"/><text x="21" y="149" class="key">A</text><text x="58" y="155" class="row">Demon Armor</text><text x="208" y="155" class="small">→ Demon Skin until learned</text>
    </g>
    <text x="65" y="915" class="section">D-PAD</text>
    <text x="65" y="940" class="small">↑ Unending Breath   •   → Sense Demons</text>
    <text x="65" y="964" class="small">↓ SmartQuestItem   •   ← Eye of Kilrogg</text>
    <text x="65" y="994" class="section">BACK PADDLES</text>
    <text x="65" y="1018" class="small">P1 WL PetAbility   •   P2 WL PetCC   •   P3 WL PetPassive</text>
    <text x="65" y="1042" class="small">P4 Recklessness → Tongues → Exhaustion → Drain Mana</text>
  </g>

  <!-- Both -->
  <g>
    <rect x="1095" y="610" width="470" height="445" rx="20" fill="#241d0d" stroke="#e4b742" stroke-width="3"/>
    <text x="1125" y="653" class="h" fill="#ffd45c">LT + RT</text>
    <text x="1125" y="681" class="sh">Hold both triggers — utility / out of combat</text>
    <text x="1125" y="719" class="section">FACE BUTTONS</text>
    <g transform="translate(1125,730)">
      <rect width="42" height="34" rx="17" fill="#3b3011"/><text x="21" y="17" class="key">X</text><text x="58" y="23" class="row">Create Healthstone</text><text x="270" y="23" class="small">Lesser → Minor</text>
      <rect y="44" width="42" height="34" rx="17" fill="#3b3011"/><text x="21" y="61" class="key">Y</text><text x="58" y="67" class="row">Create Soulstone</text><text x="260" y="67" class="small">Lesser → Minor</text>
      <rect y="88" width="42" height="34" rx="17" fill="#3b3011"/><text x="21" y="105" class="key">B</text><text x="58" y="111" class="row">Ritual of Summoning</text>
      <rect y="132" width="42" height="34" rx="17" fill="#3b3011"/><text x="21" y="149" class="key">A</text><text x="58" y="155" class="row">Banish</text>
    </g>
    <text x="1125" y="915" class="section">D-PAD</text>
    <text x="1125" y="940" class="small">↑ SmartBandage   •   → Enslave Demon</text>
    <text x="1125" y="964" class="small">↓ SmartFood   •   ← SmartFlask</text>
    <text x="1125" y="994" class="section">BACK PADDLES</text>
    <text x="1125" y="1018" class="small">P1 Hellfire   •   P2 Hearthstone</text>
    <text x="1125" y="1042" class="small">P3 SmartDrink   •   P4 WL UseSoulstn</text>
  </g>

  <!-- Controller -->
  <g transform="translate(800,555) scale(.82)">
    <path d="M-240,-130 C-305,-100 -340,-25 -334,80 C-330,155 -294,192 -249,179 L-122,108 H122 L249,179 C294,192 330,155 334,80 C340,-25 305,-100 240,-130 C175,-160 112,-132 65,-105 H-65 C-112,-132 -175,-160 -240,-130Z" fill="#17191f" stroke="#505567" stroke-width="6"/>
    <path d="M-143,-125 L-120,-184 L-55,-173 L-40,-111" fill="#20232b" stroke="#67eca0" stroke-width="5"/>
    <path d="M143,-125 L120,-184 L55,-173 L40,-111" fill="#20232b" stroke="#ff7a83" stroke-width="5"/>
    <text x="-91" y="-146" class="row" text-anchor="middle">LT</text><text x="91" y="-146" class="row" text-anchor="middle">RT</text>
    <circle cx="-145" cy="20" r="48" fill="#0c0d11" stroke="#555b6b" stroke-width="5"/><circle cx="110" cy="82" r="48" fill="#0c0d11" stroke="#555b6b" stroke-width="5"/>
    <g transform="translate(-62,78)" fill="#08090c"><rect x="-14" y="-49" width="28" height="98" rx="7"/><rect x="-49" y="-14" width="98" height="28" rx="7"/></g>
    <g class="key">
      <circle cx="155" cy="-16" r="25" fill="#22252c" stroke="#c78cff" stroke-width="3"/><text x="155" y="-16">Y</text>
      <circle cx="202" cy="31" r="25" fill="#22252c" stroke="#c78cff" stroke-width="3"/><text x="202" y="31">B</text>
      <circle cx="155" cy="78" r="25" fill="#22252c" stroke="#c78cff" stroke-width="3"/><text x="155" y="78">A</text>
      <circle cx="108" cy="31" r="25" fill="#22252c" stroke="#c78cff" stroke-width="3"/><text x="108" y="31">X</text>
    </g>
    <g class="key"><rect x="-190" y="146" width="52" height="36" rx="12" fill="#301b45" stroke="#a263e9" stroke-width="2"/><text x="-164" y="164">P1</text><rect x="-131" y="171" width="52" height="36" rx="12" fill="#301b45" stroke="#a263e9" stroke-width="2"/><text x="-105" y="189">P2</text><rect x="79" y="171" width="52" height="36" rx="12" fill="#301b45" stroke="#a263e9" stroke-width="2"/><text x="105" y="189">P3</text><rect x="138" y="146" width="52" height="36" rx="12" fill="#301b45" stroke="#a263e9" stroke-width="2"/><text x="164" y="164">P4</text></g>
  </g>

  <text x="800" y="1078" text-anchor="middle" class="small">Smart* entries require Rummage • P1–P4 require Backhand • Base face buttons are intentionally untouched and omitted</text>
</svg>